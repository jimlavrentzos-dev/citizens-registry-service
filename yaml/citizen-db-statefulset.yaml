apiVersion: v1
kind: Service
metadata:
  name: citizen-db
  namespace: citizens
  labels:
    app: citizen-db
spec:
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app: citizen-db
 

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citizen-db
  namespace: citizens
spec:
  serviceName: "citizen-db"
  replicas: 1
  selector:
    matchLabels:
      app: citizen-db
  template:
    metadata:
      labels:
        app: citizen-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: citizen-db-secret
                  key: mysql-root-password
            - name: MYSQL_USER
              value: registry_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: citizen-db-secret
                  key: mysql-password
            - name: MYSQL_DATABASE
              value: citizen_registry_db
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
            - name: mysql-init-config
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-init-config
          configMap:
            name: mysql-init-config
 
 
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
        namespace: citizens
      spec:
        accessModes:
         - ReadWriteOnce
        resources:
        requests:
        storage: 20Gi
 
 